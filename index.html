    <style>
        html {
            scroll-behavior: smooth;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            line-height: 1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Inter", sans-serif;
            background-color: #07080b;
            margin: 0;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .card-transition {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        /* Floating sphere animations */
        @keyframes floatSpheres {
            0% { transform: translateY(110%) translateX(0) scale(1); opacity: 0; }
            20% { opacity: var(--max-opacity, 0.35); }
            85% { opacity: var(--max-opacity, 0.35); }
            100% { transform: translateY(-110%) translateX(45px) scale(0.5); opacity: 0; }
        }
        .gravity-sphere {
            position: absolute;
            bottom: -20px;
            background: radial-gradient(circle, var(--sphere-color, rgba(16, 185, 129, 0.45)) 0%, transparent 70%);
            border-radius: 50%;
            animation: floatSpheres var(--duration, 10s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            pointer-events: none;
            z-index: 1;
        }

        /* Tells the browser to skip layout/style/paint entirely for cards
           scrolled offscreen -- with a big garage this is the difference
           between rendering (and running blurred ambient-sphere animations
           for) every single card at once vs. only the ones actually visible.
           contain-intrinsic-size reserves the card's real height so the
           page doesn't jump around as cards enter/exit the viewport. */
        .garage-card-cv {
            content-visibility: auto;
            contain-intrinsic-size: 340px 100%;
        }

        /* Smooth glow + very slight zoom on car-card hover (replaces the old
           shine-sweep effect, which felt too aggressive) */
        .card-glow-hover {
            transition: box-shadow 0.4s ease, border-color 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card-glow-hover:hover {
            transform: scale(1.012);
            box-shadow: 0 0 0 1px rgba(var(--glow-rgb, 255, 255, 255), 0.5), 0 16px 40px rgba(var(--glow-rgb, 255, 255, 255), 0.22), 0 12px 28px rgba(0,0,0,0.85);
        }

        /* A second, bigger/brighter copy of the card's own color glow that
           fades in on hover -- makes the background "grow and glow more"
           instead of the static glow just sitting there. */
        .card-glow-overlay {
            position: absolute;
            inset: -20%;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(0.9);
            pointer-events: none;
            z-index: 0;
        }
        .group:hover .card-glow-overlay {
            opacity: 1;
            transform: scale(1);
        }

        /* Staggered card entry animations */
        @keyframes cascadeIn {
            0% { opacity: 0; transform: translateY(15px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .staggered-card {
            animation: cascadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        /* Fluid modal window transitions */
        @keyframes modalEntrance {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes modalExit {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.95) translateY(10px); }
        }
        .modal-active {
            animation: modalEntrance 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .modal-closing {
            animation: modalExit 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes dropdownEntrance {
            0% { opacity: 0; transform: translateY(-6px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .dropdown-active {
            animation: dropdownEntrance 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Garage loading screen -- simple, smooth spinner + pulse */
        @keyframes spinSmooth {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-spin-smooth {
            animation: spinSmooth 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.55); opacity: 0.5; }
        }
        .loading-pulse-dot {
            animation: pulseDot 1.1s ease-in-out infinite;
        }
        @keyframes loadingFadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .loading-screen-exit {
            animation: loadingFadeOut 0.4s ease-out forwards;
        }

        /* Mission roll rails: tumbling reel + springy settle */
        @keyframes slotTumbleIn {
            0% { transform: translateY(-130%); opacity: 0; }
            55% { transform: translateY(10%); opacity: 1; }
            75% { transform: translateY(-4%); }
            100% { transform: translateY(0); opacity: 1; }
        }
        .rail-tumble {
            animation: slotTumbleIn 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, opacity;
        }
        @keyframes railSettleFlash {
            0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.55); background-color: rgba(16,185,129,0.18); }
            100% { box-shadow: 0 0 0 10px rgba(16,185,129,0); background-color: rgba(16,185,129,0.06); }
        }
        .rail-settled {
            animation: railSettleFlash 0.7s ease-out forwards;
        }
        @keyframes railSettleBounce {
            0% { transform: scale(1); }
            35% { transform: scale(1.06); }
            60% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }
        .rail-settle-bounce {
            animation: railSettleBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), railSettleFlash 0.7s ease-out forwards;
        }
        @keyframes railCheckPop {
            0% { transform: scale(0) rotate(-30deg); opacity: 0; }
            60% { transform: scale(1.3) rotate(8deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .rail-check-pop {
            animation: railCheckPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes rollModalEnter {
            0% { opacity: 0; transform: scale(0.92) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .roll-modal-enter {
            animation: rollModalEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes missionPanelEnter {
            0% { opacity: 0; transform: translateX(24px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .mission-panel-enter {
            animation: missionPanelEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes continuePulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(16,185,129,0.35); }
            50% { box-shadow: 0 8px 32px rgba(16,185,129,0.6); }
        }
        .continue-pulse {
            animation: continuePulse 1.6s ease-in-out infinite;
        }
        @keyframes masteryPillGlow {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.5), inset 0 0 20px rgba(255,255,255,0.3); }
            100% { box-shadow: 0 0 24px 4px rgba(255,255,255,0), inset 0 0 30px rgba(255,255,255,0); }
        }
        .mastery-pill-glow {
            animation: masteryPillGlow 0.55s ease-out;
        }

                    resolve(base64Str);
                    return;

                    let height = img.height;
                    
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;

                    if (height > maxHeight) {
                        width = Math.round((width * maxHeight) / height);
                        height = maxHeight;

                hash = (hash * 31 + str.charCodeAt(i)) | 0;

            return `${(hash >>> 0).toString(36)}_${str.length}`;
        };

        // Compresses a photo TWICE: a small "display" copy (this is the one
        // that actually lives in the car's data, gets rendered on cards, and
        // sits in memory the whole time you're using the site) and a much
        // higher quality "download" copy. The download copy is saved into
        // IndexedDB and NOT kept in memory/state, so it costs nothing while
        // you're just browsing, but it's still there, full quality, the
        // moment you actually hit a download button.
        const compressWithFullRes = async (base64Str, displaySpec, downloadSpec) => {
            const display = await compressBase64(base64Str, displaySpec.w, displaySpec.h, displaySpec.q);
            try {
                const full = await compressBase64(base64Str, downloadSpec.w, downloadSpec.h, downloadSpec.q);
                await idbSet(`fullres_${simpleImageHash(display)}`, full);
            } catch (e) {
                console.warn("Couldn't stash a full-res download copy (falling back to display quality on download):", e);
            }
            return display;
        };

        // Looks up the stashed full-quality copy for whatever photo is
        // currently on screen. Falls back to the on-screen version itself if
        // nothing was saved (older photos added before this existed).
        const getFullResForDownload = async (displayImgSrc) => {
            try {
                const full = await idbGet(`fullres_${simpleImageHash(displayImgSrc)}`);
                return full || displayImgSrc;
            } catch (e) {
                return displayImgSrc;
            }
        };

        // ---------------------------------------------------------------------
        // IndexedDB storage layer.
        //
        // localStorage caps out around 5-10MB per site, which is nowhere near
        // enough for ~120 cars with cover photos + galleries -- that's what was
        // silently truncating the garage back down to one car on reload. This
        // switches the actual car data over to IndexedDB, which browsers grant
        // hundreds of MB (often a % of free disk space) to. It's still 100%
        // local/offline storage living on your computer -- nothing leaves the
        // browser -- it's just a bigger, more reliable bucket than localStorage.
        // ---------------------------------------------------------------------
        const IDB_DB_NAME = 'okgarage_mini_db';
        const IDB_STORE_NAME = 'kv';

        const idbOpen = () => {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    reject(new Error("IndexedDB unsupported in this browser"));
                    return;
                }
                const req = indexedDB.open(IDB_DB_NAME, 1);
                req.onupgradeneeded = () => {
                    if (!req.result.objectStoreNames.contains(IDB_STORE_NAME)) {
                        req.result.createObjectStore(IDB_STORE_NAME);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        };

        const idbGet = async (key) => {
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE_NAME, 'readonly');
                const req = tx.objectStore(IDB_STORE_NAME).get(key);
                req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
                req.onerror = () => reject(req.error);
            });
        };

        const idbSet = async (key, value) => {
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
                tx.objectStore(IDB_STORE_NAME).put(value, key);
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => reject(tx.error);
            });
        };

        const idbDelete = async (key) => {
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE_NAME, 'readwrite');
                tx.objectStore(IDB_STORE_NAME).delete(key);
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => reject(tx.error);
            });
        };

        // ---------------------------------------------------------------------
        // "okgarage" watermark logo, used on downloaded card/photo exports.
        //
        // Loaded once via fetch()+blob rather than a plain <img crossOrigin>:
        // once it's turned into a blob: URL it's same-origin as far as the
        // canvas is concerned, so exporting the canvas afterward (toBlob/
        // toDataURL) never throws a "tainted canvas" security error, regardless
        // of GitHub's own CORS headers. Using the direct raw.githubusercontent.com
        // URL (rather than the github.com "blob" page + ?raw=true redirect)
        // since it's the one guaranteed to send proper CORS headers.
        // ---------------------------------------------------------------------
        const OK_LOGO_URL = 'https://raw.githubusercontent.com/okfait/okgarage-mini/main/ok%20(27).png';
        let cachedLogoImgPromise = null;

        const loadOkLogo = () => {
            if (cachedLogoImgPromise) return cachedLogoImgPromise;
            const attempt = (async () => {
                const response = await fetch(OK_LOGO_URL, { mode: 'cors' });
                if (!response.ok) throw new Error("Failed to fetch OK logo: " + response.status);
                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error("Failed to decode OK logo image"));
                    img.src = objectUrl;
                });
            })();
            // Don't cache a failed attempt -- let the next save retry the fetch
            // instead of being stuck forever after one transient network blip.
            attempt.catch(() => { cachedLogoImgPromise = null; });
            cachedLogoImgPromise = attempt;
            return cachedLogoImgPromise;
        };

        // Second logo: a self-contained badge (already has its own background
        // baked in) used inline in the card export's stats row. Drawn exactly
        // as-is with no glow/outline/opacity effects applied.
        const OK_BADGE_LOGO_URL = 'https://raw.githubusercontent.com/okfait/okgarage-mini/main/01%20(92).png';
        let cachedBadgeLogoImgPromise = null;

        const loadOkBadgeLogo = () => {
            if (cachedBadgeLogoImgPromise) return cachedBadgeLogoImgPromise;
            const attempt = (async () => {
                const response = await fetch(OK_BADGE_LOGO_URL, { mode: 'cors' });
                if (!response.ok) throw new Error("Failed to fetch OK badge logo: " + response.status);
                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error("Failed to decode OK badge logo image"));
                    img.src = objectUrl;
                });
            })();
            attempt.catch(() => { cachedBadgeLogoImgPromise = null; });
            cachedBadgeLogoImgPromise = attempt;
            return cachedBadgeLogoImgPromise;
        };

        // Finds the tight bounding box of an image's actually-visible (non
        // fully-transparent) pixels, cached on the image object itself. Logo
        // PNGs often have uneven blank margins baked in, which throws off both
        // centering and perceived size if you just use the raw image bounds --
        // this crops to what's actually drawn instead.
        const getTrimmedImageBounds = (img) => {
            if (img._trimmedBounds) return img._trimmedBounds;
            try {
                const c = document.createElement('canvas');
                c.width = img.width;
                c.height = img.height;
                const cctx = c.getContext('2d');
                cctx.drawImage(img, 0, 0);
                const { data } = cctx.getImageData(0, 0, c.width, c.height);
                let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
                for (let y = 0; y < c.height; y++) {
                    for (let x = 0; x < c.width; x++) {
                        const alpha = data[(y * c.width + x) * 4 + 3];
                        if (alpha > 10) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }
                if (maxX < 0) {
                    img._trimmedBounds = { sx: 0, sy: 0, sw: img.width, sh: img.height };
                } else {
                    img._trimmedBounds = { sx: minX, sy: minY, sw: (maxX - minX + 1), sh: (maxY - minY + 1) };
                }
            } catch (e) {
                img._trimmedBounds = { sx: 0, sy: 0, sw: img.width, sh: img.height };
            }
            return img._trimmedBounds;
        };

        // Draws an image cropped to its trimmed (visible-content) bounds, fit
        // and centered inside the given target box.
        const drawImageTrimmedCentered = (ctx, img, targetCenterX, targetCenterY, maxWidth, maxHeight) => {
            const tb = getTrimmedImageBounds(img);
            const ratio = Math.min(maxWidth / tb.sw, maxHeight / tb.sh);
            const dw = tb.sw * ratio;
            const dh = tb.sh * ratio;
            ctx.drawImage(img, tb.sx, tb.sy, tb.sw, tb.sh, targetCenterX - dw / 2, targetCenterY - dh / 2, dw, dh);
        };

        // Draws the transparent OK logo with a clean white outline hugging its
        // silhouette -- used as a corner watermark on Photo Album exports. The
        // outline is built by stamping the shape (recolored solid white) at
        // several offsets around a ring, which reads as a crisp border instead
        // of the flat smudge a plain shadow/blur glow produces.
        const drawOkWatermark = (ctx, canvasWidth, canvasHeight, logoImg, options = {}) => {
            const sizeRatio = options.sizeRatio ?? 0.15;
            const alpha = options.alpha ?? 0.6;
            const marginRatio = options.marginRatio ?? 0.035;

            const targetWidth = Math.round(canvasWidth * sizeRatio);
            const targetHeight = Math.round(targetWidth * (logoImg.height / logoImg.width));
            const margin = Math.round(canvasWidth * marginRatio);
            const x = canvasWidth - targetWidth - margin;
            const y = canvasHeight - targetHeight - margin;

            const outlineWidth = Math.max(2, Math.round(targetWidth * 0.05));
            const outlinePad = outlineWidth + 2;
            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = targetWidth + outlinePad * 2;
            maskCanvas.height = targetHeight + outlinePad * 2;
            const maskCtx = maskCanvas.getContext('2d');
            const steps = 16;
            for (let i = 0; i < steps; i++) {
                const angle = (i / steps) * Math.PI * 2;
                const dx = Math.cos(angle) * outlineWidth;
                const dy = Math.sin(angle) * outlineWidth;
                maskCtx.drawImage(logoImg, outlinePad + dx, outlinePad + dy, targetWidth, targetHeight);
            }
            maskCtx.globalCompositeOperation = 'source-in';
            maskCtx.fillStyle = '#ffffff';
            maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.drawImage(maskCanvas, x - outlinePad, y - outlinePad);
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.drawImage(logoImg, x, y, targetWidth, targetHeight);
            ctx.restore();
        };

        // Triggers a browser download for a canvas, saved as a PNG file.
        const downloadCanvasAsPng = (canvas, filename) => {
            canvas.toBlob((blob) => {
                if (!blob) return;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, 'image/png');
        };

        // Loads any image source (data URL, blob URL, etc.) into an <img>,
        // resolving once it's decoded and ready to draw onto a canvas.
        const loadImageEl = (src) => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error("Failed to load image"));
                img.src = src;
            });
        };

        // Rounded-rect path helper (drawn manually for broad browser support).
        const traceRoundedRectPath = (ctx, x, y, width, height, radius) => {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + width, y, x + width, y + height, radius);
            ctx.arcTo(x + width, y + height, x, y + height, radius);
            ctx.arcTo(x, y + height, x, y, radius);
            ctx.arcTo(x, y, x + width, y, radius);
            ctx.closePath();
        };

        const sanitizeFileNamePart = (str) => (str || "")
            .toString()
            .replace(/[^a-z0-9]+/gi, '_')
            .replace(/^_+|_+$/g, '') || "car";

        const generateFailsafeLore = (car, sectionName) => {
            const brand = car.brand || "Concept";
            const model = car.modelName || "Machine";
            const year = car.year || "2026";
            const hp = car.horsepower || "450";
            const speed = car.topSpeed || "180";
            const engine = car.engineType || "Internal Combustion Engine";
            const cost = car.cost ? car.cost.toLocaleString() : "150,000";

            const descriptors = {
                ENGINE: [
                    `The mechanical core of the ${year} ${brand} ${model} represents an absolute pinnacle of high-precision engineering. Every single element inside the advanced ${engine} architecture has been designed from the ground up to yield unyielding performance limits under extreme track stress. Rated at a highly responsive ${hp} horsepower output, the setup utilizes reinforced internal linkages and state-of-the-art direct injection systems to guarantee instantaneous throttle response. This is not merely a machine; it is a meticulously calibrated heart built to beat with total confidence.\n\nFurthermore, the thermodynamic system incorporates high-pressure radiator channels accompanied by dual-stage intercooling matrices, keeping heat dissipation perfectly balanced.`
                ],
                AERODYNAMICS: [
                    `Boundary layer flow manipulation and strategic downforce allocation dictate the sleek outer contours of the ${brand} ${model}. Designed to confidently slice through absolute atmospheric drag up to speeds of ${speed} mph, every splitter and rear wing contour serves a deliberate thermodynamic purpose. Air currents are funneled through lower dynamic splitters, generating a localized low-pressure pocket underneath the floor pan to literally suck the chassis flat onto the tarmac.\n\nSimultaneously, the upper body contours are sculpted to minimize turbulent wake formation. Drag reduction systems work harmoniously with discrete lateral diffusers, channeling cooling air directly toward the heavy brake calipers to prevent fade.`
                ],
                DESIGN: [
                    `The visual architecture of the ${brand} ${model} is a striking exhibition of luxury elegance colliding with purpose-built motorsport design. Valued at a premium asset threshold of $${cost}, the silhouette commands respect within any prestigious car collection worldwide. Flush-fitting carbon weave panels, sleek integrated LED arrays, and an aggressive stance give this model a commanding road presence.\n\nInside the cabin, the layout places structural focus squarely on the pilot. Premium hand-stitched leather surfaces exist alongside manual analog dials and raw machined metal toggles. Every control point rests comfortably within the driver's natural line of reach.`
                ],
                PERFORMANCE: [
                    `Out on the circuit, the ${brand} ${model} displays lateral acceleration metrics that defy standard category bounds. Turning hard into tight hairpins exposes zero body roll, maintained perfectly via sophisticated dual-wishbone link structures and active suspension damping. With a calculated sell-back valuation of approximately $${Math.round(car.cost * 0.75).toLocaleString()}, it serves as a highly resilient and sound long-term investment in pure driving capability.\n\nBraking performance is equally relentless. Large, carbon-composite discs offer instantaneous deceleration response, bringing the chassis back under control.`
                ],
                LEGACY: [
                    `This historic model pays magnificent tribute to generations of racing bloodlines. Re-engineered to withstand the trials of contemporary circuit limits, the ${brand} has carved its name permanently into motorsport history. It stands as an iconic emblem of engineering ambition, showing what happens when a design team refuses to compromise on mechanical passion.\n\nDecades from now, collector platforms will look back at this exact generation as the absolute golden era of performance mechanics. The raw acoustic sound profile, the rich tactile feel of the steering, and the mechanical feedback make it irreplaceable.`
                ]
            };

            const section = sectionName.toUpperCase();
            const list = descriptors[section] || descriptors.ENGINE;
            const randomIdx = Math.abs(brand.charCodeAt(0) + year.charCodeAt(0) + section.charCodeAt(0)) % list.length;
            return list[randomIdx];
        };

        function RevealOnScroll({ children }) {
            const [isVisible, setIsVisible] = useState(false);
            const domRef = useRef();

            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    });
                }, { threshold: 0.1 });
                
                if (domRef.current) {
                    observer.observe(domRef.current);
                }
                return () => {
                    if (domRef.current && observer) observer.disconnect();
                }
            }, []);

            return (
                <div 
                    ref={domRef} 
                    className={`transition-all duration-[1000ms] transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}
                >
                    {children}
                </div>
            );
        }

        const AmbientSpheres = ({ colorRGB, count = 12, intensify = false }) => {
            const spheres = useMemo(() => {
                return Array.from({ length: count }).map((_, idx) => ({
                    id: idx,
                    size: Math.random() * 40 + 12,
                    left: Math.random() * 92 + 4,
                    duration: Math.random() * 8 + 6,
                    delay: `${Math.random() * -8}s`,
                    maxOpacity: Math.random() * 0.25 + 0.12
                }));
            }, [colorRGB, count]);

            return (
                <div 
                    className="absolute inset-0 pointer-events-none overflow-hidden z-0 rounded-[inherit] transition-[filter] duration-500 ease-out"
                    style={{ filter: intensify ? 'brightness(1.8) saturate(1.3)' : 'brightness(1) saturate(1)' }}
                >
                    {spheres.map((sphere) => {
                        const duration = intensify ? sphere.duration * 0.6 : sphere.duration;
                        return (
                            <div 
                                key={sphere.id}
                                className="gravity-sphere"
                                style={{
                                    '--sphere-color': `rgba(${colorRGB || '16, 185, 129'}, 0.5)`,
                                    '--duration': `${duration}s`,
                                    '--delay': sphere.delay,
                                    width: `${sphere.size}px`,
                                    height: `${sphere.size}px`,
                                    left: `${sphere.left}%`,
                                    '--max-opacity': sphere.maxOpacity,
                                    filter: `blur(${sphere.size * 0.32}px)`,
                                    transition: 'animation-duration 0.5s ease'
                                }}
                            />
                        );
                    })}
                </div>
            );
        };

        // Racetrack stopwatch readout, isolated from the rest of the app.
        // Ticks its own local state every 10ms while running instead of the
        // parent App re-rendering (which used to mean the whole garage grid,
        // every ambient-sphere animation, etc. re-rendered 100x/sec any time
        // the stopwatch was going). Writes to liveRef each tick so the
        // parent can read the exact current value synchronously on Stop
        // without needing it in React state.
        const LiveStopwatch = ({ isRunning, startRef, liveRef, frozenMs, formatLapTime }) => {
            const [displayMs, setDisplayMs] = useState(frozenMs);

            useEffect(() => {
                if (!isRunning) setDisplayMs(frozenMs);
            }, [frozenMs, isRunning]);

            useEffect(() => {
                if (!isRunning) return;
                const interval = setInterval(() => {
                    const ms = Date.now() - startRef.current;
                    liveRef.current = ms;
                    setDisplayMs(ms);
                }, 10);
                return () => clearInterval(interval);
            }, [isRunning]);

            return <span className="text-lg font-mono font-black text-white">{formatLapTime(displayMs)}</span>;
        };

        // A single car card on the main garage grid, split out into its own
        // piece and wrapped in React.memo. Before this, clicking or hovering
        // ANY card made the whole page recalculate EVERY card at once (that
        // was the main cause of the click-lag) -- now a card only
        // recalculates itself when something about IT actually changes.
        const GarageCard = React.memo(({ car, gridIndex, isHovered, onHoverCard, onContextMenu, onOpenGallery, onResetMastery, getDynamicGradient, getCarLevel, getLevelBadgeStyles, getGreenvilleTagStyles, getMasteryLevel }) => {
            const spec = getDynamicGradient(car.color);
            const resolvedLevel = getCarLevel(car);
            const badgeStyles = getLevelBadgeStyles(resolvedLevel);
            const mastery = getMasteryLevel(car.masteryXp);

            // Hold the mouse down on the card for 5 seconds -> resets this
            // car's Mastery back to 0. holdProgress (0-1) drives the little
            // ring overlay so it's obvious something's happening while you
            // hold, instead of it just silently firing after a delay.
            const [holdProgress, setHoldProgress] = useState(0);
            const holdIntervalRef = useRef(null);
            const holdStartRef = useRef(0);
            const longPressFiredRef = useRef(false);
            const RESET_HOLD_MS = 5000;

            const cancelHold = () => {
                if (holdIntervalRef.current) {
                    clearInterval(holdIntervalRef.current);
                    holdIntervalRef.current = null;
                }
                setHoldProgress(0);
            };

            const startHold = (e) => {
                if (e.button !== 0) return; // left click only
                longPressFiredRef.current = false;
                holdStartRef.current = Date.now();
                holdIntervalRef.current = setInterval(() => {
                    const elapsed = Date.now() - holdStartRef.current;
                    const progress = Math.min(1, elapsed / RESET_HOLD_MS);
                    setHoldProgress(progress);
                    if (progress >= 1) {
                        clearInterval(holdIntervalRef.current);
                        holdIntervalRef.current = null;
                        longPressFiredRef.current = true;
                        onResetMastery(car.id);
                        setHoldProgress(0);
                    }
                }, 50);
            };

            useEffect(() => () => {
                if (holdIntervalRef.current) clearInterval(holdIntervalRef.current);
            }, []);

            const handleCardClick = () => {
                // A completed hold already did its thing (the reset) --
                // don't also open the gallery on the mouseup/click that follows.
                if (longPressFiredRef.current) {
                    longPressFiredRef.current = false;
                    return;
                }
                onOpenGallery(car);
            };

            return (
                <div 
                    onContextMenu={(e) => onContextMenu(e, car.id)}
                    onMouseEnter={() => onHoverCard(car.id)}
                    onMouseLeave={() => { onHoverCard(null); cancelHold(); }}
                    onMouseDown={startHold}
                    onMouseUp={cancelHold}
                    onClick={handleCardClick}
                    style={{ background: spec.gradient, borderColor: spec.border, animationDelay: `${gridIndex * 25}ms`, '--glow-rgb': spec.rawRGB }}
                    className="group relative rounded-2xl p-5 border transition-all card-transition h-[340px] overflow-hidden shadow-[0_12px_28px_rgba(0,0,0,0.85)] cursor-pointer staggered-card card-glow-hover garage-card-cv"
                >
                    <AmbientSpheres colorRGB={spec.rawRGB} count={3} intensify={isHovered} />
                    <div className="card-glow-overlay" style={{ background: `radial-gradient(circle at 50% 50%, rgba(${spec.rawRGB}, 0.85) 0%, rgba(${spec.rawRGB}, 0.35) 35%, transparent 70%)` }} />

                                <div className="relative z-10 pr-1">
                                    <div className="flex gap-6 items-baseline">
                                        <div className="flex flex-col">
                                            <span className="text-[9px] text-white/40 font-bold uppercase tracking-wider mb-1">Year</span>
                                            <span className="text-xs font-bold text-white leading-none font-sans">{car.year}</span>
                                        </div>
                                        <div className="flex flex-col flex-1 min-w-0">
                                            <span className="text-[9px] text-white/40 font-bold uppercase tracking-wider mb-1">Model</span>
                                            <span className="text-xs font-bold text-white leading-none truncate font-sans">{car.brand} {car.modelName}</span>
                                        </div>
                                        <div className="text-right flex-shrink-0">
                                            <div className="text-[9px] text-white/40 font-bold uppercase tracking-wider mb-0.5">Level</div>
                                            <span 
                                                style={{ backgroundColor: badgeStyles.bg, color: badgeStyles.text, borderColor: badgeStyles.border, boxShadow: badgeStyles.glow || 'none' }}
                                                className="text-[10px] font-bold px-2 py-0.5 rounded border uppercase tracking-wider font-sans"
                                            >
                                                {resolvedLevel === 'Permbanned' ? <span className="material-symbols-outlined text-[12px] leading-none align-middle">block</span> : (resolvedLevel === 'Level 0' ? '0' : resolvedLevel)}
                                            </span>
                                        </div>
                                    </div>
                                    <div className="text-[10px] text-white/60 font-semibold mt-1 font-sans">
                                        {car.trim && `Trim: ${car.trim}`}
                                    </div>
                                </div>

                    {/* Transparent background completely removes black/dark grey rectangle tints to fix image_83f046.jpg */}
                    <div className="absolute top-[85px] left-1/2 -translate-x-1/2 pointer-events-none z-0 w-[82%] flex items-center justify-center bg-transparent h-[140px]">
                        {car.image ? (
                            <img src={car.image} alt="active cover" loading="lazy" decoding="async" className="max-w-full max-h-full object-contain bg-transparent block mx-auto transition-transform duration-500 ease-out group-hover:scale-110" />
                        ) : (
                            <svg className="w-12 h-12 text-white/10 select-none animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" strokeLinecap="round" strokeLinejoin="round"/>
                                <circle cx="7" cy="17" r="2"/>
                                <path d="M9 17h6" strokeLinecap="round" strokeLinejoin="round"/>
                                <circle cx="17" cy="17" r="2"/>
                            </svg>
                        )}
                    </div>

                    <div className="absolute bottom-5 left-5 right-5 z-10 flex flex-col gap-2 bg-transparent">
                        <div className="grid grid-cols-4 gap-x-1.5 pt-1 border-t border-white/[0.04]">
                            <div>

        // Same idea as GarageCard: the BVE Registry list was still doing the

        const BveCard = React.memo(({ car, idx, ownedCar, isHovered, onHoverCard, onOpenGallery, onResetMastery, getDynamicGradient, getLevelBadgeStyles, getGreenvilleTagStyles, getMasteryLevel }) => {
            const nameWords = car.name.split(' ');

            // Same hold-to-reset-Mastery behavior as the main garage cards.

            const [holdProgress, setHoldProgress] = useState(0);
            const holdIntervalRef = useRef(null);

            const cancelHold = () => {
                if (holdIntervalRef.current) {

                setHoldProgress(0);

            const startHold = (e) => {
                if (e.button !== 0 || !ownedCar) return;
                longPressFiredRef.current = false;
                holdStartRef.current = Date.now();
                holdIntervalRef.current = setInterval(() => {
                    const elapsed = Date.now() - holdStartRef.current;
                    const progress = Math.min(1, elapsed / RESET_HOLD_MS);
                    setHoldProgress(progress);
                    if (progress >= 1) {
                        clearInterval(holdIntervalRef.current);
                        holdIntervalRef.current = null;
                        longPressFiredRef.current = true;
                        onResetMastery(ownedCar.id);
                        setHoldProgress(0);

                }, 50);

            useEffect(() => () => {

        // Custom-styled dropdown replacing native <select> -- native selects
        // can't be styled consistently (their open option list uses whatever
        // ugly default the OS/browser gives you), so this matches the app's
        // existing dark dropdown look everywhere else instead.
        const FormSelect = ({ icon, label, value, options, onChange, optionIcons }) => {
            const [isOpen, setIsOpen] = useState(false);
            const wrapRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (wrapRef.current && !wrapRef.current.contains(e.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="flex flex-col gap-1" ref={wrapRef}>
                    <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans flex items-center gap-1">
                        {icon && <span className="material-symbols-outlined text-[12px]">{icon}</span>} {label}
                    </label>
                    <div className="relative">
                        <button
                            type="button"
                            onClick={() => setIsOpen(!isOpen)}
                            className="w-full bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans flex items-center justify-between text-left"
                        >

                                {value}
                            </span>
                            <span className="text-[9px] text-white/40">▼</span>
                        </button>

                            <div className="absolute left-0 right-0 mt-2 bg-[#18181c] border border-white/10 rounded-xl p-1 max-h-56 overflow-y-auto shadow-[0_12px_32px_rgba(0,0,0,0.6)] z-50 flex flex-col dropdown-active">
                                {options.map(opt => (
                                    <button
                                        key={opt}
                                        type="button"
                                        onClick={() => { onChange(opt); setIsOpen(false); }}
                                        className={`px-3 py-2 text-left text-xs font-semibold rounded-lg transition-colors font-sans flex items-center gap-2 ${
                                            value === opt ? "bg-white/10 text-white" : "text-white/60 hover:bg-white/5 hover:text-white"
                                        }`}
                                    >
                                        {optionIcons && optionIcons[opt] && <img src={optionIcons[opt]} alt="" className="w-4 h-4 object-contain opacity-80" />}
                                        {opt}
                                    </button>

        function App() {
            // Robust storage configuration
            const PRIMARY_STORAGE_KEY = 'okgarage_mini_fleet_v15';
            const FALLBACK_KEYS = [
                'okgarage_mini_fleet_v13',
                'okgarage_mini_fleet',
                'gv_pro_garage_deck_v13',
                'gv_pro_garage_deck_v10'
            ];

            const [garage, setGarage] = useState([]);
            const [isInitialized, setIsInitialized] = useState(false);
            const [loadingReveal, setLoadingReveal] = useState({ show: true, loaded: 0, total: 0, exiting: false });
            const [cloudSavingActive, setCloudSavingActive] = useState(false);

            // --- Chapter 4: missions ---
            const MISSIONS_STORAGE_KEY = 'okgarage_mini_missions_v1';
            const [missions, setMissions] = useState([]);
            const [missionsLoaded, setMissionsLoaded] = useState(false);
            const [isMissionHubOpen, setIsMissionHubOpen] = useState(false);
            const [isNewMissionRolling, setIsNewMissionRolling] = useState(false);
            const [rollRandomizer, setRollRandomizer] = useState({ spinning: false, display: '', value: null });
            const [rollSelection, setRollSelection] = useState({ spinning: false, display: '', value: null });
            const [rollGarage, setRollGarage] = useState({ spinning: false, display: '', value: null });
            const [rollMission, setRollMission] = useState({ spinning: false, display: '', value: null, params: null });
            const [rollComplete, setRollComplete] = useState(false);
            const [missionTimerTick, setMissionTimerTick] = useState(0);

            useEffect(() => {
                (async () => {
                    try {
                        const saved = await idbGet(MISSIONS_STORAGE_KEY);
                        if (saved) setMissions(saved);
                    } catch (e) {
                        console.warn("Failed to load missions:", e);
                    } finally {
                        setMissionsLoaded(true);
                    }
                })();
            }, []);

            useEffect(() => {
                if (!missionsLoaded) return;
                idbSet(MISSIONS_STORAGE_KEY, missions).catch(e => console.warn("Failed to save missions:", e));
            }, [missions, missionsLoaded]);

            // Ticks active timer-missions once a second: drives the live
            // countdown display and auto-completes when time runs out (no
            // manual "complete" button for timer missions by design).
            useEffect(() => {
                const hasActiveTimer = missions.some(m => m.status === 'active' && m.timerStartedAt);
                if (!hasActiveTimer) return;
                const interval = setInterval(() => {
                    setMissionTimerTick(t => t + 1);
                    setMissions(prev => prev.map(m => {
                        if (m.status === 'active' && m.timerStartedAt) {
                            const missionType = MISSION_TYPES.find(mt => mt.id === m.missionTypeId);
                            if (missionType && missionType.kind === 'timer') {
                                const elapsed = Date.now() - m.timerStartedAt;
                                const durationSeconds = missionType.getDurationSeconds(m.params || {});
                                if (elapsed >= durationSeconds * 1000) {
                                    awardMissionXp(m.carId, missionType.xp);
                                    return { ...m, status: 'completed', completedAt: Date.now(), timerStartedAt: null };
                                }
                            }
                        }
                        return m;
                    }));
                }, 1000);
                return () => clearInterval(interval);
            }, [missions]);

            // Theme context states
            const [palette, setPalette] = useState(() => {
                try {
                    const saved = localStorage.getItem('okgarage_color_palette');
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                return [
                    { name: "Red", hex: "#c81e32" },
                    { name: "Blue", hex: "#1e50d2" },
                    { name: "Green", hex: "#1ea046" },
                    { name: "Yellow", hex: "#ffd60a" },
                    { name: "Purple", hex: "#bf5af2" },
                    { name: "Gray", hex: "#5a5f6e" },
                    { name: "Orange", hex: "#ff9f0a" }
                ];
            });

            const [customHex, setCustomHex] = useState('#5a5f6e');
            const [paletteContextMenu, setPaletteContextMenu] = useState(null);
            const [geminiKey, setGeminiKey] = useState(() => {
                try { return localStorage.getItem('gemini_api_key') || ''; } catch (e) { return ''; }
            });

            // Layout split parameters
            const [splitOffset, setSplitOffset] = useState(50);

            // Filtering query boundaries
            const [bveSearch, setBveSearch] = useState('');
            const [debouncedBveSearch, setDebouncedBveSearch] = useState('');
            useEffect(() => {
                const t = setTimeout(() => setDebouncedBveSearch(bveSearch), 200);
                return () => clearTimeout(t);
            }, [bveSearch]);
            const [bveLevelFilter, setBveLevelFilter] = useState('All');
            const [activeServer, setActiveServer] = useState(() => {

                    return 'SGR';

            const [garageSearch, setGarageSearch] = useState('');
            const [debouncedGarageSearch, setDebouncedGarageSearch] = useState('');
            useEffect(() => {
                const t = setTimeout(() => setDebouncedGarageSearch(garageSearch), 200);
                return () => clearTimeout(t);
            }, [garageSearch]);
            const [garageSortBy, setGarageSortBy] = useState('Year');
            const [sortDirection, setSortDirection] = useState('desc');
            const [showOnlyFavorites, setShowOnlyFavorites] = useState(false);

            const [colorFilter, setColorFilter] = useState('All Colors');
            const [isColorDropdownOpen, setIsColorDropdownOpen] = useState(false);
            const [levelFilter, setLevelFilter] = useState('All Levels');
            const [isLevelDropdownOpen, setIsLevelDropdownOpen] = useState(false);
            const [typeFilter, setTypeFilter] = useState('All Types');
            const [isTypeDropdownOpen, setIsTypeDropdownOpen] = useState(false);
            const [passFilter, setPassFilter] = useState('All Passes');
            const [isPassDropdownOpen, setIsPassDropdownOpen] = useState(false);

            // Dynamic interaction tracking
            const [hoveredCardId, setHoveredCardId] = useState(null);
            const [isVignetteHovered, setIsVignetteHovered] = useState(false);
            const [hoveredBveIndex, setHoveredBveIndex] = useState(null);
            const [contextMenu, setContextMenu] = useState({ visible: false, x: 0, y: 0, carId: null });
            
            const [addEditModalState, setAddEditModalState] = useState({ isRendered: false, isVisible: false });
            const [galleryModalState, setGalleryModalState] = useState({ isRendered: false, isVisible: false });
            
            const [currentCar, setCurrentCar] = useState(null);
            const [isAiImportOpen, setIsAiImportOpen] = useState(false);
            const [aiImportText, setAiImportText] = useState('');
            const [toast, setToast] = useState({ visible: false, message: '' });

            const [selectedGalleryCar, setSelectedGalleryCar] = useState(null);
            const bulkFileInputRef = useRef(null);
            const paletteCanvasRef = useRef(null);
            const [sampledPicData, setSampledPicData] = useState(null);

            // Stop watch states -- lapTime only holds the FROZEN value (set on
            // start/stop/reset). While running, the live milliseconds live in
            // liveLapTimeRef + the isolated <LiveStopwatch> component below,

            // that was the single biggest source of the button-press lag).
            const [isLapRunning, setIsLapRunning] = useState(false);
            const masteryPillRef = useRef(null);
            const [pillGlowing, setPillGlowing] = useState(false);

            // ---------------------------------------------------------------------
            const normalizeBveName = (str) => (str || "")

                const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
                for (let i = 0; i <= a.length; i++) dp[i][0] = i;
                for (let j = 0; j <= b.length; j++) dp[0][j] = j;
                for (let i = 1; i <= a.length; i++) {
                    for (let j = 1; j <= b.length; j++) {
                        if (a[i - 1] === b[j - 1]) {
                            dp[i][j] = dp[i - 1][j - 1];
                        } else {
                            dp[i][j] = 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
                        }

                return dp[a.length][b.length];

            // relative to word length) to catch a typo without over-matching.
            const wordsFuzzyMatch = (w1, w2) => {
                if (w1 === w2) return true;
                if (w1.length < 3 || w2.length < 3) return false;
                const dist = levenshteinDistance(w1, w2);
                const maxLen = Math.max(w1.length, w2.length);

                const { r, g, b } = resolveRawRGB(colorInput);

                // Chroma (max-min RGB channel spread) is a more reliable "is this
                // actually a neutral gray" test than HSL saturation -- saturation
                // math gets distorted for darker/lighter colors and was letting
                // real automotive grays (which often have a faint cool/warm cast)
                // slip through and get classified as Blue/etc instead of Gray.
                const chroma = Math.max(r, g, b) - Math.min(r, g, b);
                if (l < 14) return 'Black';
                if (l > 90 && chroma < 20) return 'White';
                if (chroma < 26) return 'Gray';
                if (h < 15 || h >= 345) return 'Red';
                if (h < 45) return 'Orange';
                if (h < 70) return 'Yellow';
                if (h < 165) return 'Green';
                if (h < 200) return 'Cyan';
                if (h < 255) return 'Blue';
                if (h < 300) return 'Purple';
                return 'Pink';
            };

                    const query = `${car.year || ''} ${brandStr} ${modelStr} ${trimStr}`.toLowerCase();

                    const matchesFavorite = !showOnlyFavorites || car.favorite;

                    let matchesColor = true;
                    if (colorFilter !== 'All Colors') {

                    let matchesLevel = true;
                    if (levelFilter !== 'All Levels') {
                        const resolvedLvl = getCarLevel(car).toLowerCase().trim();
                        const filterLvl = levelFilter.toLowerCase().trim();

                    }

                    let matchesType = true;
                    if (typeFilter !== 'All Types') {

                    let matchesPass = true;
                    if (passFilter !== 'All Passes') {

                    return matchesSearch && matchesFavorite && matchesColor && matchesLevel && matchesType && matchesPass;

                    // Once those run out, the rest sort by year using the

                    const noYear = result.filter(c => !c.year && c.year !== 0);

                    noYear.sort((a, b) => {
                        const nameA = `${a.brand || ''} ${a.modelName || ''}`.toLowerCase().trim();

                    hasYear.sort((a, b) => {

                        return sortDirection === 'desc' ? (valA < valB ? 1 : -1) : (valA > valB ? 1 : -1);

                    return [...noYear, ...hasYear];

                        valA = Number(a.topSpeed) || 0;
                        valB = Number(b.topSpeed) || 0;
                    }

                    return sortDirection === 'desc' ? (valA < valB ? 1 : -1) : (valA > valB ? 1 : -1);

            // --- Chapter 4: mission roll sequence ---

            // Real slot-reel feel: ticks start fast and progressively slow
            // down (ease-out) as the spin runs out, like a physical reel
            // losing momentum, instead of flickering at a flat rate and then
            // just cutting to the answer. In the last stretch it starts
            // showing the actual final value between random flickers so it
            // reads as "settling onto" the result rather than jump-cutting.
            const spinRailValues = async (values, onTick, finalValue, spinMs = 1900) => {
                if (values.length === 0) return;
                const minTick = 45;
                const maxTick = 260;
                const start = performance.now();
                let elapsed = 0;
                while (elapsed < spinMs) {
                    const progress = elapsed / spinMs;
                    const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
                    const tickMs = minTick + (maxTick - minTick) * eased;

                    if (finalValue !== undefined && progress > 0.72 && Math.random() < (progress - 0.72) / 0.28) {
                        onTick(finalValue);
                    } else {
                        onTick(values[Math.floor(Math.random() * values.length)]);
                    }

                    await sleep(tickMs);
                    elapsed = performance.now() - start;
                }
                if (finalValue !== undefined) onTick(finalValue);

            const handleStartRoll = async () => {

                setRollGarage({ spinning: false, display: '—', value: null });
                setRollMission({ spinning: false, display: '—', value: null, params: null });

                // Rail 1: Randomizer
                const finalRandomizer = MISSION_RANDOMIZER_TYPES[Math.floor(Math.random() * MISSION_RANDOMIZER_TYPES.length)];
                await spinRailValues(MISSION_RANDOMIZER_TYPES, (v) => setRollRandomizer({ spinning: true, display: v, value: null }), finalRandomizer);
                setRollRandomizer({ spinning: false, display: finalRandomizer, value: finalRandomizer });
                await sleep(350);

                // Rail 2: Selection (skipped entirely if Randomizer landed on "Random Car")
                let finalSelection = null;
                let selectionOptions = [];
                if (finalRandomizer === 'Color') {
                    selectionOptions = [...new Set(garage.map(c => getColorFamily(c.color)))];

                } else if (finalRandomizer === 'Pass') {

                if (finalRandomizer === 'Random Car' || selectionOptions.length === 0) {

                    finalSelection = selectionOptions[Math.floor(Math.random() * selectionOptions.length)];

                    setRollSelection({ spinning: false, display: finalSelection, value: finalSelection });

                await sleep(350);

            // Particle burst that scatters outward from wherever the
            // completion button was clicked, then "magnets" each particle
            // toward the mastery pill in the header. Pure imperative DOM/Web
            // Animations API work -- not React state -- since this is a
            // one-off visual effect, not something that needs to persist or
            // re-render.
            const spawnXpBurst = (originEl, colorRGB) => {
                if (!originEl || !masteryPillRef.current) return;
                const originRect = originEl.getBoundingClientRect();
                const targetRect = masteryPillRef.current.getBoundingClientRect();
                const originX = originRect.left + originRect.width / 2;
                const originY = originRect.top + originRect.height / 2;
                const targetX = targetRect.left + targetRect.width / 2;
                const targetY = targetRect.top + targetRect.height / 2;

                const particleCount = 16;
                let landed = 0;

                for (let i = 0; i < particleCount; i++) {
                    const el = document.createElement('div');
                    el.style.position = 'fixed';
                    el.style.left = `${originX}px`;
                    el.style.top = `${originY}px`;
                    el.style.width = '7px';
                    el.style.height = '7px';
                    el.style.borderRadius = '50%';
                    el.style.background = `rgb(${colorRGB})`;
                    el.style.boxShadow = `0 0 10px rgba(${colorRGB},0.9)`;
                    el.style.zIndex = '9999';
                    el.style.pointerEvents = 'none';
                    document.body.appendChild(el);

                    const burstAngle = Math.random() * Math.PI * 2;
                    const burstDist = 35 + Math.random() * 45;
                    const burstX = Math.cos(burstAngle) * burstDist;
                    const burstY = Math.sin(burstAngle) * burstDist;
                    const dx = targetX - originX;
                    const dy = targetY - originY;
                    // Slower, gentler float: longer hang-time at the burst
                    // point before the particle eases in toward the pill,
                    // instead of snapping straight there.
                    const duration = 1400 + Math.random() * 500;
                    const delay = Math.random() * 260;

                    const anim = el.animate([
                        { transform: 'translate(-50%, -50%) scale(0.6)', opacity: 0, offset: 0 },
                        { transform: `translate(calc(-50% + ${burstX}px), calc(-50% + ${burstY}px)) scale(1.15)`, opacity: 1, offset: 0.22 },
                        { transform: `translate(calc(-50% + ${burstX}px), calc(-50% + ${burstY}px)) scale(1)`, opacity: 1, offset: 0.45 },
                        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.25)`, opacity: 0.9, offset: 1 }
                    ], {
                        duration,
                        delay,
                        easing: 'cubic-bezier(0.45, 0, 0.2, 1)',
                        fill: 'forwards'
                    });
                    anim.onfinish = () => {
                        el.remove();
                        landed++;
                        if (landed === 1) {
                            setPillGlowing(true);
                            setTimeout(() => setPillGlowing(false), 750);
                        }
                    };
                }
            };

            const handleMissionTimerToggle = (mission) => {
                setMissions(prev => prev.map(m => m.id === mission.id ? { ...m, timerStartedAt: Date.now(), timerElapsedMs: 0 } : m));
            };

            const handleCompleteMission = (missionId) => {
                const mission = missions.find(m => m.id === missionId);
                const missionType = mission ? MISSION_TYPES.find(mt => mt.id === mission.missionTypeId) : null;
                setMissions(prev => prev.map(m => m.id === missionId ? { ...m, status: 'completed', completedAt: Date.now(), timerStartedAt: null } : m));
                if (mission && missionType) awardMissionXp(mission.carId, missionType.xp);
                showNotification("Mission complete!");
            };

            // Counter missions (photo tour, uber): one tap = +1 progress,
            // auto-completes once it hits the target.
            const handleIncrementCounterMission = (mission) => {
                const missionType = MISSION_TYPES.find(mt => mt.id === mission.missionTypeId);
                if (!missionType) return;
                const target = missionType.getTarget(mission.params || {});
                const nextProgress = (mission.progress || 0) + 1;
                const isDone = nextProgress >= target;
                setMissions(prev => prev.map(m => m.id === mission.id ? {
                    ...m,
                    progress: nextProgress,
                    status: isDone ? 'completed' : 'active',
                    completedAt: isDone ? Date.now() : null
                } : m));
                if (isDone) {
                    awardMissionXp(mission.carId, missionType.xp);
                    showNotification("Mission complete!");
                }
            };

            // The Cut: cuts count toward target directly, overtakes count for
            // double (bonus for actually catching up after the cut).
            const handleCutProgress = (mission, type) => {
                const missionType = MISSION_TYPES.find(mt => mt.id === mission.missionTypeId);
                if (!missionType) return;
                const target = missionType.getTarget(mission.params || {});
                const cuts = (mission.cutCount || 0) + (type === 'cut' ? 1 : 0);
                const overtakes = (mission.overtakeCount || 0) + (type === 'overtake' ? 1 : 0);
                const totalPoints = cuts + overtakes * 2;
                const isDone = totalPoints >= target;
                setMissions(prev => prev.map(m => m.id === mission.id ? {
                    ...m,
                    cutCount: cuts,
                    overtakeCount: overtakes,
                    status: isDone ? 'completed' : 'active',
                    completedAt: isDone ? Date.now() : null
                } : m));
                if (isDone) {
                    awardMissionXp(mission.carId, missionType.xp);
                    showNotification("Mission complete!");
                }
            };

            const handleCancelMission = (missionId) => {
                setMissions(prev => prev.filter(m => m.id !== missionId));
                showNotification("Mission cancelled.");
            };

            const formatMissionTimer = (ms) => {
                const totalSeconds = Math.max(0, Math.floor(ms / 1000));
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            // Pressing Escape closes whatever's on top -- small popups/menus
            // first, then modals, so it behaves the same everywhere instead of
            // needing a different key handler per screen.
            useEffect(() => {
                const handleEscKey = (e) => {
                    if (e.key !== 'Escape') return;
                    if (paletteContextMenu) {
                        setPaletteContextMenu(null);
                        return;
                    }
                    if (contextMenu.visible) {
                        setContextMenu(prev => ({ ...prev, visible: false }));
                        return;
                    }
                    if (isColorDropdownOpen) { setIsColorDropdownOpen(false); return; }
                    if (isLevelDropdownOpen) { setIsLevelDropdownOpen(false); return; }
                    if (isTypeDropdownOpen) { setIsTypeDropdownOpen(false); return; }
                    if (isPassDropdownOpen) { setIsPassDropdownOpen(false); return; }
                    if (addEditModalState.isRendered) {
                        handleCloseAddEdit();
                        return;
                    }
                    if (galleryModalState.isRendered) {
                        handleCloseGallery();
                        return;
                    }
                };
                document.addEventListener('keydown', handleEscKey);
                return () => document.removeEventListener('keydown', handleEscKey);
            }, [paletteContextMenu, contextMenu.visible, isColorDropdownOpen, isLevelDropdownOpen, isTypeDropdownOpen, isPassDropdownOpen, addEditModalState.isRendered, galleryModalState.isRendered]);

            const fetchGeminiLore = async (car, sectionName) => {
                if (!geminiKey) return;
                
                showNotification(`AI writing engine generating copy: ${sectionName}...`);
                const systemPrompt = "You are an elite, automotive copywriter for a high-end racing catalog. Write exactly one dynamic, context-aware paragraph describing the specified section of this car.";
                const prompt = `Write a deep mechanical, luxurious paragraph describing the ${sectionName} of the following car: Year ${car.year}, Brand ${car.brand}, Model ${car.modelName}, Trim ${car.trim}, Horsepower ${car.horsepower} HP, Top Speed ${car.topSpeed} mph, Cost $${car.cost}. Use standard phrasing. No lists, just clean automotive copy. Keep under 380 letters.`;

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    const json = await res.json();
                    const text = json.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        const updatedLoreMap = {
                            ...(car.loreMap || {}),
                            [sectionName]: text.trim()
                        };
                        const updatedGarage = garage.map(c => {
                            if (c.id === car.id) {
                                return { ...c, loreMap: updatedLoreMap };
                            }
                            return c;
                        });
                        setGarage(updatedGarage);
                        setSelectedGalleryCar(prev => ({ ...prev, loreMap: updatedLoreMap }));
                        showNotification(`Gemini parsed lore updated for ${sectionName}!`);
                    }
                } catch (e) {
                    console.error("Gemini request failed", e);
                    showNotification("Gemini request failed. Check API key.");
