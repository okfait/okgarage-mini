            };

            const handleDownloadLocalBackup = () => {
                try {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(garage));
                    const dlAnchorElem = document.createElement('a');
                    dlAnchorElem.setAttribute("href", dataStr);
                    dlAnchorElem.setAttribute("download", `okgarage_backup_${Date.now()}.json`);
                    dlAnchorElem.click();
                    showNotification("Backup saved directly.");
                } catch (e) {
                    console.error("Backup failed: ", e);
                }
            };

            const handleImportLocalFile = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (Array.isArray(parsed)) {
                            showNotification("Converting schemas and compressing images...");
                            
                            // Safe decompression parsing
                            const sanitized = await Promise.all(parsed.map(async (car, idx) => {
                                let brand = car.brand || "";
                                let modelName = car.modelName || "";
                                if (!brand && !modelName && car.makeModel) {
                                    const words = car.makeModel.split(' ');
                                    brand = words[0] || "Concept";
                                    modelName = words.slice(1).join(' ') || "Machine";
                                }

                                let compressedImg = car.image || "";
                                if (compressedImg && compressedImg.startsWith("data:image")) {
                                    compressedImg = await compressBase64(compressedImg);
                                }

                                let compressedImages = [];
                                if (car.images && car.images.length > 0) {
                                    compressedImages = await Promise.all(car.images.map(async (img) => {
                                        if (img && img.startsWith("data:image")) {
                                            return await compressWithFullRes(
                                                img,
                                                { w: 1400, h: 1050, q: 0.85 },
                                                { w: 3200, h: 2400, q: 0.95 }
                                            );
                                        }
                                        return img;
                                    }));
                                }

                                return {
                                    ...car,
                                    brand,
                                    modelName,
                                    image: compressedImg,
                                    images: compressedImages,
                                    id: car.id || (Date.now() + idx)
                                };
                            }));

                            setGarage(sanitized);
                            showNotification("Local backup restored successfully.");
                        } else {
                            showNotification("Invalid file format.");
                        }
                    } catch (err) {
                        showNotification("Incorrect configuration file format.");
                    }
                };
                reader.readAsText(file);
            };

            const handleBulkImageUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                showNotification("Compressing uploaded photos...");
                const newImages = [];

                for (const file of files) {
                    await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = async () => {
                            // Display copy: what actually gets shown on the site and
                            // kept in memory. Much smaller than before -- this was
                            // the single biggest thing eating your RAM.
                            const compressed = await compressWithFullRes(
                                reader.result,
                                { w: 1400, h: 1050, q: 0.85 },
                                { w: 3200, h: 2400, q: 0.95 }
                            );
                            newImages.push(compressed);
                            resolve();
                        };
                        reader.readAsDataURL(file);
                    });
                }

                const updatedGarage = garage.map(c => {
                    if (c.id === selectedGalleryCar.id) {
                        const prevImages = c.images || [];
                        const combined = [...prevImages, ...newImages];
                        const updatedCar = { 
                            ...c, 
                            images: combined,
                            image: c.image || newImages[0] 
                        };
                        setSelectedGalleryCar(updatedCar);
                        return updatedCar;
                    }
                    return c;
                });
                setGarage(updatedGarage);
                showNotification(`Imported and optimized ${newImages.length} images.`);
            };

            const handleSelectActiveCover = (imgBase64) => {
                const updatedGarage = garage.map(c => {
                    if (c.id === selectedGalleryCar.id) {
                        const updatedCar = { ...c, image: imgBase64 };
                        setSelectedGalleryCar(updatedCar);
                        return updatedCar;
                    }
                    return c;
                });
                setGarage(updatedGarage);
                showNotification("Primary card cover updated!");
            };

            const handleDeleteImageFromGallery = (indexToDelete) => {
                const updatedGarage = garage.map(c => {
                    if (c.id === selectedGalleryCar.id) {
                        const prevImages = c.images || [];
                        const combined = prevImages.filter((_, idx) => idx !== indexToDelete);
                        let nextCover = c.image;
                        if (c.image === prevImages[indexToDelete]) {
                            nextCover = combined[0] || "";
                        }
                        const updatedCar = { ...c, images: combined, image: nextCover };
                        setSelectedGalleryCar(updatedCar);
                        return updatedCar;
                    }
                    return c;
                });
                setGarage(updatedGarage);
                showNotification("Image removed from gallery.");
            };

            // Renders the compact car card (year/model/level/trim/photo/HP/buy
            // price/tags) to a canvas and downloads it as a transparent-corner
            // PNG with the OK watermark, so it looks the same outside the site.
            const handleSaveCardImage = async (car) => {
                try {
                    showNotification("Rendering card image...");
                    const scale = 3; // draw at 3x for a crisp, genuinely full-quality export
                    // Matches the live card's actual proportions, with extra
                    // top/bottom breathing room so nothing feels cramped against
                    // the edges.
                    const width = 480 * scale;
                    const height = 580 * scale;
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';

                    const spec = getDynamicGradient(car.color);
                    const [r, g, b] = spec.rawRGB.split(',').map(s => parseInt(s.trim(), 10));
                    const radius = 28 * scale;
                    const pad = 24 * scale;
                    const baseR = 7, baseG = 8, baseB = 11; // near-black card base

                    // Clip everything to a rounded rect so the four corners of
                    // the PNG stay fully transparent instead of solid squares.
                    traceRoundedRectPath(ctx, 0, 0, width, height, radius);
                    ctx.save();
                    ctx.clip();

                    // Background: blend the selected color into the near-black
                    // base as fully OPAQUE colors at every stop (rather than
                    // varying alpha), so there's no alpha+color joint
                    // interpolation. That joint interpolation was the actual
                    // cause of the "extra weird ring" artifact -- mixing alpha
                    // and hue at the same time doesn't fade smoothly on a canvas
                    // gradient. Blending to solid colors ourselves guarantees a
                    // clean single fade from the color down to near-black.
                    const blend = (t) => `rgb(${Math.round(r * t + baseR * (1 - t))}, ${Math.round(g * t + baseG * (1 - t))}, ${Math.round(b * t + baseB * (1 - t))})`;
                    const outerRadius = Math.sqrt((width / 2) ** 2 + (height / 2) ** 2);
                    const bgGradient = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, outerRadius);
                    bgGradient.addColorStop(0, blend(0.58));
                    bgGradient.addColorStop(0.22, blend(0.30));
                    bgGradient.addColorStop(0.55, blend(0.08));
                    bgGradient.addColorStop(0.85, blend(0));
                    bgGradient.addColorStop(1, blend(0));
                    ctx.fillStyle = bgGradient;
                    ctx.fillRect(0, 0, width, height);

                    const topPad = pad + 18 * scale; // extra top breathing room
                    // Year / Model header row
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.font = `bold ${9 * scale}px sans-serif`;
                    ctx.fillText('YEAR', pad, topPad + 10 * scale);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${14 * scale}px sans-serif`;
                    ctx.fillText(String(car.year || ''), pad, topPad + 28 * scale);

                    const modelX = pad + 70 * scale;
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.font = `bold ${9 * scale}px sans-serif`;
                    ctx.fillText('MODEL', modelX, topPad + 10 * scale);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${14 * scale}px sans-serif`;
                    const modelText = `${car.brand || ''} ${car.modelName || ''}`.trim();
                    let displayModel = modelText;
                    const maxModelWidth = width - modelX - 110 * scale;
                    while (ctx.measureText(displayModel).width > maxModelWidth && displayModel.length > 3) {
                        displayModel = displayModel.slice(0, -1);
                    }
                    if (displayModel !== modelText) displayModel = displayModel.trim() + '…';
                    ctx.fillText(displayModel, modelX, topPad + 28 * scale);

                    // Level badge, right-aligned
                    const resolvedLevel = getCarLevel(car);
                    const badgeStyles = getLevelBadgeStyles(resolvedLevel);
                    const levelText = resolvedLevel === 'Level 0' ? '0' : resolvedLevel;
                    ctx.font = `bold ${9 * scale}px sans-serif`;
                    const levelLabelWidth = ctx.measureText('LEVEL').width;
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fillText('LEVEL', width - pad - levelLabelWidth, topPad + 10 * scale);

                    ctx.font = `bold ${10 * scale}px sans-serif`;
                    const levelTextWidth = ctx.measureText(levelText).width;
                    const badgePadX = 8 * scale;
                    const badgeWidth = levelTextWidth + badgePadX * 2;
                    const badgeHeight = 20 * scale;
                    const badgeX = width - pad - badgeWidth;
                    const badgeY = topPad + 14 * scale;
                    traceRoundedRectPath(ctx, badgeX, badgeY, badgeWidth, badgeHeight, 5 * scale);
                    ctx.fillStyle = badgeStyles.bg;
                    ctx.fill();
                    ctx.strokeStyle = badgeStyles.border;
                    ctx.lineWidth = 1 * scale;
                    ctx.stroke();
                    ctx.fillStyle = badgeStyles.text;
                    ctx.textAlign = 'center';
                    ctx.fillText(levelText, badgeX + badgeWidth / 2, badgeY + badgeHeight / 2 + 4 * scale);
                    ctx.textAlign = 'left';

                    // Trim line
                    const headerBottom = topPad + 48 * scale;
                    if (car.trim) {
                        ctx.fillStyle = 'rgba(255,255,255,0.6)';
                        ctx.font = `600 ${11 * scale}px sans-serif`;
                        ctx.fillText(`Trim: ${car.trim}`, pad, headerBottom);
                    }

                    // Bottom block (divider + stats row + tags) is pinned to the
                    // bottom of the card, tightened up and pulled closer to the
                    // bottom edge than before.
                    const bottomPad = pad + 8 * scale;
                    const tagsRowHeight = 22 * scale;
                    const statsBlockHeight = 78 * scale;
                    const bottomBlockHeight = statsBlockHeight + tagsRowHeight;
                    const statsY = height - bottomPad - bottomBlockHeight;

                    // Car photo centered in the flexible space between the header
                    // and the bottom block, with extra side/vertical margin so it
                    // doesn't sit right against the edges.
                    const imgSideMargin = 26 * scale;
                    const imgBoxTop = headerBottom + 20 * scale;
                    const imgBoxHeight = statsY - imgBoxTop - 20 * scale;
                    if (car.image && imgBoxHeight > 0) {
                        try {
                            const fullResCover = await getFullResForDownload(car.image);
                            const carImg = await loadImageEl(fullResCover);
                            const maxW = width - pad * 2 - imgSideMargin * 2;
                            const maxH = imgBoxHeight;
                            let dw = carImg.width, dh = carImg.height;
                            const ratio = Math.min(maxW / dw, maxH / dh);
                            dw *= ratio; dh *= ratio;
                            const dx = (width - dw) / 2;
                            const dy = imgBoxTop + (imgBoxHeight - dh) / 2;
                            ctx.drawImage(carImg, dx, dy, dw, dh);
                        } catch (e) {
                            console.warn("Failed loading car image for export:", e);
                        }
                    }

                    // Divider
                    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                    ctx.lineWidth = 1 * scale;
                    ctx.beginPath();
                    ctx.moveTo(pad, statsY);
                    ctx.lineTo(width - pad, statsY);
                    ctx.stroke();

                    // 5-column stats row: Top Speed | HP | Logo badge | Buy Price | Color
                    const colWidth = (width - pad * 2) / 5;
                    const colCenter = (i) => pad + colWidth * (i + 0.5);
                    const labelY = statsY + 18 * scale;
                    const valueY = statsY + 38 * scale;

                    ctx.textAlign = 'center';

                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.font = `bold ${8.5 * scale}px sans-serif`;
                    ctx.fillText('TOP SPEED', colCenter(0), labelY);
                    ctx.fillText('HP', colCenter(1), labelY);
                    ctx.fillText('BUY PRICE', colCenter(3), labelY);
                    ctx.fillText('COLOR', colCenter(4), labelY);

                    ctx.font = `bold ${12 * scale}px sans-serif`;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(`${car.topSpeed || 0} mph`, colCenter(0), valueY);
                    ctx.fillText(`${car.horsepower || 0} HP`, colCenter(1), valueY);
                    ctx.fillStyle = '#30d158';
                    ctx.fillText(`$${Number(car.cost || 0).toLocaleString()}`, colCenter(3), valueY);

                    // Color swatch: just the "COLOR" label + a circle in the
                    // car's actual color -- no name text underneath anymore.
                    const swatchY = statsY + 36 * scale;
                    const swatchRadius = 9 * scale;
                    ctx.beginPath();
                    ctx.arc(colCenter(4), swatchY, swatchRadius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                    ctx.lineWidth = 1 * scale;
                    ctx.stroke();

                    // Logo badge (self-contained artwork, drawn as-is, no color/
                    // opacity effects). Cropped to its actual visible content
                    // first so it's genuinely centered in its column and can be
                    // sized generously without empty padding eating into it.
                    try {
                        const badgeLogo = await loadOkBadgeLogo();
                        drawImageTrimmedCentered(
                            ctx,
                            badgeLogo,
                            colCenter(2),
                            statsY + 27 * scale,
                            colWidth - 20 * scale,
                            36 * scale
                        );
                    } catch (logoErr) {
                        console.warn("Could not load OK badge logo:", logoErr);
                        showNotification("Card saved, but the logo couldn't load (check your connection).");
                    }

                    ctx.textAlign = 'left';

                    // Tags row
                    const tagsY = statsY + statsBlockHeight;
                    if (car.tags && car.tags.length > 0) {
                        let tagX = pad;
                        car.tags.forEach(tag => {
                            const tagStyles = getGreenvilleTagStyles(tag);
                            ctx.font = `bold ${10 * scale}px sans-serif`;
                            const tagTextWidth = ctx.measureText(tag).width;
                            const tagPadX = 10 * scale;
                            const tagW = tagTextWidth + tagPadX * 2;
                            const tagH = 22 * scale;
                            traceRoundedRectPath(ctx, tagX, tagsY, tagW, tagH, tagH / 2);
                            ctx.fillStyle = tagStyles.bg;
                            ctx.fill();
                            ctx.strokeStyle = tagStyles.border;
                            ctx.lineWidth = 1 * scale;
                            ctx.stroke();
                            ctx.fillStyle = tagStyles.text;
                            ctx.textAlign = 'center';
                            ctx.fillText(tag, tagX + tagW / 2, tagsY + tagH / 2 + 4 * scale);
                            ctx.textAlign = 'left';
                            tagX += tagW + 8 * scale;
                        });
                    } else {
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.font = `italic ${10 * scale}px sans-serif`;
                        ctx.fillText('No tags', pad, tagsY + 15 * scale);
                    }

                    ctx.restore(); // lift the rounded-rect clip before drawing the border

                    // Thin colored border ring matching the site's card border
                    // (same color as the background glow, at the same low
                    // opacity the site uses -- the export's border was both too
                    // thick and too opaque before).
                    const borderWidth = 1 * scale;
                    traceRoundedRectPath(ctx, borderWidth / 2, borderWidth / 2, width - borderWidth, height - borderWidth, radius - borderWidth / 2);
                    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.3)`;
                    ctx.lineWidth = borderWidth;
                    ctx.stroke();

                    const filename = `${sanitizeFileNamePart(car.year)}_${sanitizeFileNamePart(car.brand)}_${sanitizeFileNamePart(car.modelName)}_card.png`;
                    downloadCanvasAsPng(canvas, filename);
                    showNotification("Card image saved!");
                } catch (err) {
                    console.error("Failed to save card image:", err);
                    showNotification("Couldn't generate the card image. Please try again.");
                }
            };

            // Downloads a single Photo Album image at full resolution with the
            // OK watermark composited bottom-right.
            const handleSaveGalleryPhoto = async (imgSrc, car, idx) => {
                try {
                    showNotification("Preparing photo for download...");
                    const fullResSrc = await getFullResForDownload(imgSrc);
                    const photoImg = await loadImageEl(fullResSrc);
                    const canvas = document.createElement('canvas');
                    canvas.width = photoImg.width;
                    canvas.height = photoImg.height;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(photoImg, 0, 0, canvas.width, canvas.height);

                    try {
                        const badgeLogo = await loadOkBadgeLogo();
                        const tb = getTrimmedImageBounds(badgeLogo);
                        const targetWidth = Math.round(canvas.width * 0.07);
                        const targetHeight = Math.round(targetWidth * (tb.sh / tb.sw));
                        const margin = Math.round(canvas.width * 0.03);
                        drawImageTrimmedCentered(
                            ctx,
                            badgeLogo,
                            canvas.width - margin - targetWidth / 2,
                            canvas.height - margin - targetHeight / 2,
                            targetWidth,
                            targetHeight
                        );
                    } catch (logoErr) {
                        console.warn("Could not load OK badge logo:", logoErr);
                        showNotification("Photo saved, but the logo couldn't load (check your connection).");
                    }

                    const filename = `${sanitizeFileNamePart(car.year)}_${sanitizeFileNamePart(car.brand)}_${sanitizeFileNamePart(car.modelName)}_photo_${idx + 1}.png`;
                    downloadCanvasAsPng(canvas, filename);
                    showNotification("Photo saved!");
                } catch (err) {
                    console.error("Failed to save gallery photo:", err);
                    showNotification("Couldn't save that photo. Please try again.");
                }
            };

            // Keeps the hidden sampling canvas in sync with whatever picture is
            // currently shown for color-sampling. This used to only happen
            // inside the upload handler below, so editing an EXISTING car (whose
            // picture is set directly via setSampledPicData(car.image), never
            // going through that upload flow) left the canvas blank -- any click
            // then sampled from an empty canvas and always came back black.
            useEffect(() => {
                if (!sampledPicData) return;
                const img = new Image();
                img.onload = () => {
                    if (!paletteCanvasRef.current) return;
                    const canvas = paletteCanvasRef.current;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = sampledPicData;
            }, [sampledPicData]);

            const handleDeletePaletteSwatch = (name) => {
                const nextPalette = palette.filter(p => p.name !== name);
                setPalette(nextPalette);
                try {
                    localStorage.setItem('okgarage_color_palette', JSON.stringify(nextPalette));
                } catch (e) {}
                setPaletteContextMenu(null);
                showNotification(`Removed "${name}" from vignette themes.`);
            };

            const handleAddFrontCardPic = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const compressed = await compressWithFullRes(
                        event.target.result,
                        { w: 1200, h: 900, q: 0.92 },
                        { w: 2600, h: 1950, q: 0.95 }
                    );
                    setSampledPicData(compressed);
                    setCurrentCar(prev => ({ ...prev, image: compressed }));
                    showNotification("Optimized front cover uploaded! Tap cover to extract paints.");
                };
                reader.readAsDataURL(file);
            };

            const handleSamplePicClick = (e) => {
                if (!paletteCanvasRef.current) return;
                const canvas = paletteCanvasRef.current;
                const rect = e.target.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * canvas.width;
                const y = ((e.clientY - rect.top) / rect.height) * canvas.height;
                
                try {
                    const ctx = canvas.getContext('2d');
                    const pixel = ctx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
                    const r = pixel[0];
                    const g = pixel[1];
                    const b = pixel[2];
                    
                    const componentToHex = (c) => {
                        const hex = c.toString(16);
                        return hex.length === 1 ? "0" + hex : hex;
                    };
                    const extractedHex = `#${componentToHex(r)}${componentToHex(g)}${componentToHex(b)}`;
                    
                    setCustomHex(extractedHex);
                    setCurrentCar(prev => ({ ...prev, color: extractedHex }));
                    showNotification(`Sampled paint color: ${extractedHex}`);
                } catch (err) {
                    console.error("Color sample error: ", err);
                }
            };

            const handleToggleLapTimer = () => {
                if (isLapRunning) {
                    setIsLapRunning(false);
                    const finishTime = liveLapTimeRef.current;
                    setLapTime(finishTime);
                    const prevBest = selectedGalleryCar.bestLap || 0;
                    if (prevBest === 0 || finishTime < prevBest) {
                        const updatedGarage = garage.map(c => {
                            if (c.id === selectedGalleryCar.id) {
                                const updatedCar = { ...c, bestLap: finishTime };
                                setSelectedGalleryCar(updatedCar);
                                return updatedCar;
                            }
                            return c;
                        });
                        setGarage(updatedGarage);
                        showNotification(`New Racetrack Personal Best! 🏁 ${formatLapTime(finishTime)}`);

                        // Auto-complete any active "Set a new Personal Best" mission for this car.
                        const pbMission = missions.find(m => m.carId === selectedGalleryCar.id && m.status === 'active' && m.missionTypeId === 'new_pb');
                        if (pbMission) {
                            const pbMissionType = MISSION_TYPES.find(mt => mt.id === 'new_pb');
                            setMissions(prev => prev.map(m => m.id === pbMission.id ? { ...m, status: 'completed', completedAt: Date.now() } : m));
                            if (pbMissionType) awardMissionXp(selectedGalleryCar.id, pbMissionType.xp);
                            showNotification("Mission complete: new PB!");

                        showNotification(`Lap Finished: ${formatLapTime(finishTime)}`);

                    liveLapTimeRef.current = lapTime;
                    setIsLapRunning(true);
                }

            const handleResetLapTimer = () => {

                const totalSec = Math.floor(ms / 1000);
                const min = Math.floor(totalSec / 60);
                const sec = totalSec % 60;
                const mils = Math.floor((ms % 1000) / 10);
                const pad = (n, s = 2) => ('00' + n).slice(-s);
                return `${pad(min)}:${pad(sec)}.${pad(mils)}`;

                            <div className="relative bg-[#121318] border border-white/10 rounded-3xl w-full max-w-2xl max-h-[80vh] flex flex-col shadow-[0_24px_80px_rgba(0,0,0,0.9)] overflow-hidden">

                                                    <span className="text-[11px] text-white/40 font-sans truncate">{car.year} {car.brand} {car.modelName}</span>
                                                </div>
                                                <span className={`text-[10px] font-black uppercase tracking-wider px-3 py-1 rounded-full font-sans shrink-0 ${mission.status === 'completed' ? 'bg-emerald-500/15 text-emerald-400' : 'bg-white/5 text-white/50'}`}>

                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>

                    {/* New Mission Roll -- 4 slot rails */}

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 w-full">
                                    {[
                                        { label: 'Randomizer', rail: rollRandomizer },

                                                <span className="text-[9px] text-white/40 font-bold uppercase tracking-wider font-sans">{label}</span>

                                        Cancel

                    )}

                    {toast.visible && (
                        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[150] flex items-center gap-3 px-6 py-3 rounded-full bg-[#181a20]/95 border border-white/10 shadow-[0_12px_40px_rgba(0,0,0,0.85)] transition-all">

                            <button onClick={() => setIsMissionHubOpen(true)} className="h-10 px-5 rounded-full bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 text-[13px] font-semibold transition-all flex items-center gap-1.5">

                    >
                        
                        {/* LEFT GRID PANEL: BVE LIST VIEW */}

                            <div className={`bg-[#121318] border border-white/10 w-full max-w-lg rounded-[28px] z-10 p-6 shadow-2xl relative transition-all duration-300 transform ${addEditModalState.isVisible ? 'scale-100 translate-y-0' : 'scale-95 translate-y-4'}`}>
                                <div className="flex items-center justify-between mb-6">
                                    <h3 className="text-sm font-black uppercase tracking-widest font-['Montserrat'] bg-gradient-to-r from-white to-white/60 bg-clip-text text-transparent">
                                        {currentCar.id ? 'Edit Vehicle Properties' : 'Create New Fleet Vehicle'}
                                    </h3>
                                    <button
                                        type="button"
                                        onClick={() => setIsAiImportOpen(true)}
                                        className="h-8 px-3 rounded-full bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/25 text-emerald-400 text-[10px] font-black uppercase tracking-wider transition-all flex items-center gap-1.5"
                                    >
                                        <span className="material-symbols-outlined text-[14px]">auto_awesome</span>
                                        Import from AI
                                    </button>
                                </div>
                                
                                <form onSubmit={handleSaveCar} className="flex flex-col gap-4 overflow-y-auto max-h-[70vh] pr-1">
                                    
                                    <div className="flex flex-col gap-2">
                                        <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans">Vignette Paint Theme Selection</label>
                                        <div className="grid grid-cols-8 gap-2 mb-1">
                                            {palette.map((colorObj) => {
                                                const isSelected = currentCar.color?.toLowerCase() === colorObj.name.toLowerCase();
                                                return (
                                                    <button
                                                        type="button"
                                                        key={colorObj.name}
                                                        onClick={() => {
                                                            setCurrentCar({ ...currentCar, color: colorObj.name });
                                                            setCustomHex(colorObj.hex);
                                                        }}
                                                        onContextMenu={(e) => {
                                                            e.preventDefault();
                                                            setPaletteContextMenu({ name: colorObj.name, x: e.clientX, y: e.clientY });
                                                        }}
                                                        style={{ backgroundColor: colorObj.hex }}
                                                        className={`aspect-square rounded-xl border flex items-center justify-center transition-all ${
                                                            isSelected ? 'border-white scale-110 shadow-[0_0_15px_rgba(255,255,255,0.4)]' : 'border-white/10 hover:scale-105'
                                                        }`}
                                                        title={colorObj.name}
                                                    >
                                                        {isSelected && <span className="text-[10px] text-white font-bold">✓</span>}
                                                    </button>
                                                );
                                            })}
                                            
                                            <div className="col-span-1 flex items-center justify-center relative">
                                                <input 
                                                    type="color" 
                                                    value={customHex}
                                                    onChange={e => {
                                                        const newHex = e.target.value;
                                                        setCustomHex(newHex);
                                                        setCurrentCar({ ...currentCar, color: newHex });
                                                    }}
                                                    className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                                                />
                                                <div className="w-full h-full aspect-square rounded-xl border border-dashed border-white/30 flex items-center justify-center text-[10px] text-white/60 hover:border-white/50 transition-colors font-sans">
                                                    Hex
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-3 bg-white/[0.02] border border-white/5 p-3 rounded-2xl my-1">
                                            <div 
                                                className="w-12 h-12 rounded-xl border border-white/10 flex-shrink-0" 
                                                style={{ background: getDynamicGradient(currentCar.color).gradient }}
                                            />
                                            <div>
                                                <span className="text-[10px] text-white/40 uppercase font-black block font-sans">Active Vignette Theme</span>
                                                <span className="text-xs font-semibold text-white/80 font-sans">{currentCar.color || 'No theme selected'}</span>
                                            </div>
                                        </div>

                                        {/* Picture canvas sampling interface */}
                                        <div className="flex flex-col gap-1.5 mt-2 bg-white/[0.01] border border-white/5 p-3 rounded-2xl">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[9px] text-emerald-400 font-black uppercase tracking-widest font-sans">Sample Color From Front Pic</span>
                                                <label className="px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-[10px] font-bold cursor-pointer transition-colors text-center font-sans">
                                                    Upload Pic
                                                    <input type="file" accept="image/*" onChange={handleAddFrontCardPic} className="hidden" />
                                                </label>
                                            </div>
                                            {sampledPicData && (
                                                <div className="relative mt-2 rounded-xl overflow-hidden border border-white/10 flex flex-col items-center">
                                                    <p className="text-[8px] text-white/40 font-bold mb-1 font-sans">CLICK ON THE IMAGE BELOW TO EXTRACT THE PAINT COLOR:</p>
                                                    <img 
                                                        src={sampledPicData} 
                                                        alt="sampler preview" 
                                                        onClick={handleSamplePicClick} 
                                                        className="max-h-40 object-contain w-full cursor-crosshair hover:opacity-90 transition-opacity"
                                                    />
                                                    <canvas ref={paletteCanvasRef} className="hidden" />
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex flex-col gap-1">
                                            <input 
                                                type="text" 
                                                value={currentCar.color} 
                                                onChange={e => setCurrentCar({ ...currentCar, color: e.target.value })}
                                                className="w-full bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans"
                                                placeholder="Type color name..."
                                            />
                                            <div className="flex justify-end mt-1">
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        const name = currentCar.color ? currentCar.color.trim() : "";
                                                        if (!name) {
                                                            showNotification("Please specify a name for this color theme!");
                                                            return;
                                                        }
                                                        if (palette.some(p => p.name.toLowerCase() === name.toLowerCase())) {
                                                            showNotification("A theme with this name already exists.");
                                                            return;
                                                        }
                                                        const newPalette = [...palette, { name, hex: customHex }];
                                                        setPalette(newPalette);
                                                        try {
                                                            localStorage.setItem('okgarage_color_palette', JSON.stringify(newPalette));
                                                        } catch (e) {}
                                                        showNotification(`Registered "${name}" into vignette themes!`);
                                                    }}
                                                    className="px-4 py-1.5 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/30 text-emerald-400 text-[10px] font-black transition-all font-sans uppercase tracking-wider"
                                                >
                                                    + Register Swatch Theme
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-2">
                                        <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans">Toggle Greenville Tags</label>
                                        <div className="grid grid-cols-4 gap-2">
                                            {["Limited", "Off-Sale", "Collectible", "Event"].map(tag => {
                                                const isActive = currentCar.tags?.includes(tag);
                                                const tagStyles = getGreenvilleTagStyles(tag);
                                                
                                                return (
                                                    <button
                                                        type="button"
                                                        key={tag}
                                                        onClick={() => {
                                                            const activeTags = currentCar.tags || [];
                                                            const nextTags = isActive 
                                                                ? activeTags.filter(t => t !== tag)
                                                                : [...activeTags, tag];
                                                            setCurrentCar({ ...currentCar, tags: nextTags });
                                                        }}
                                                        style={{
                                                            backgroundColor: isActive ? tagStyles.bg : 'rgba(255,255,255,0.02)',
                                                            color: isActive ? tagStyles.text : 'rgba(255,255,255,0.3)',
                                                            borderColor: isActive ? tagStyles.text : 'rgba(255,255,255,0.06)',
                                                            boxShadow: isActive ? `0 0 14px ${tagStyles.text}35` : 'none'
                                                        }}
                                                        className="py-2 rounded-xl text-[10px] font-black tracking-wider uppercase border text-center transition-all duration-300 font-sans"
                                                    >
                                                        {tag}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans">Brand (Make)</label>
                                            <input required placeholder="e.g. Western" value={currentCar.brand || ""} onChange={e => setCurrentCar({ ...currentCar, brand: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans">Model Name</label>
                                            <input required placeholder="e.g. Protobunny" value={currentCar.modelName || ""} onChange={e => setCurrentCar({ ...currentCar, modelName: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans">Trim Configuration</label>
                                            <input placeholder="e.g. XRh" value={currentCar.trim || ""} onChange={e => setCurrentCar({ ...currentCar, trim: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans">Year</label>
                                            <input placeholder="e.g. 2026" value={currentCar.year || ""} onChange={e => setCurrentCar({ ...currentCar, year: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans">Odometer Miles</label>
                                            <input type="number" step="any" placeholder="0" value={currentCar.miles} onChange={e => setCurrentCar({ ...currentCar, miles: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans">Purchase Cost ($)</label>
                                            <input type="number" placeholder="45000" value={currentCar.cost} onChange={e => setCurrentCar({ ...currentCar, cost: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans">Horsepower (HP)</label>
                                            <input type="number" placeholder="450" value={currentCar.horsepower} onChange={e => setCurrentCar({ ...currentCar, horsepower: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans">Top Speed (mph)</label>
                                            <input type="number" placeholder="180" value={currentCar.topSpeed} onChange={e => setCurrentCar({ ...currentCar, topSpeed: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-1 mt-2">
                                        <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans">Additional Specs</label>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <FormSelect
                                            icon={SPEC_ICONS.type}
                                            label="Car Type"
                                            value={currentCar.type || 'Sedan'}
                                            options={CAR_TYPES}
                                            optionIcons={CAR_TYPE_ICON_URLS}
                                            onChange={(val) => setCurrentCar({ ...currentCar, type: val })}
                                        />
                                        <FormSelect
                                            icon={SPEC_ICONS.pass}
                                            label="Pass"
                                            value={currentCar.pass || 'No Pass'}
                                            options={CAR_PASSES}
                                            onChange={(val) => setCurrentCar({ ...currentCar, pass: val })}
                                        />
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans flex items-center gap-1">
                                                <span className="material-symbols-outlined text-[12px]">{SPEC_ICONS.zeroToSixty}</span> 0-60 (seconds)
                                            </label>
                                            <input type="number" step="0.1" placeholder="3.8" value={currentCar.zeroToSixty} onChange={e => setCurrentCar({ ...currentCar, zeroToSixty: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans flex items-center gap-1">
                                                <span className="material-symbols-outlined text-[12px]">{SPEC_ICONS.safetyRating}</span> Safety Rating (0.5-5)
                                            </label>
                                            <input type="number" step="0.5" min="0.5" max="5" placeholder="4.5" value={currentCar.safetyRating} onChange={e => setCurrentCar({ ...currentCar, safetyRating: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans flex items-center gap-1">
                                                <span className="material-symbols-outlined text-[12px]">{SPEC_ICONS.weight}</span> Weight (lbs)
                                            </label>
                                            <input type="number" placeholder="3200" value={currentCar.weight} onChange={e => setCurrentCar({ ...currentCar, weight: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans flex items-center gap-1">
                                                <span className="material-symbols-outlined text-[12px]">{SPEC_ICONS.seats}</span> Seats
                                            </label>
                                            <input type="number" placeholder="4" value={currentCar.seats} onChange={e => setCurrentCar({ ...currentCar, seats: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans flex items-center gap-1">
                                                <span className="material-symbols-outlined text-[12px]">{SPEC_ICONS.country}</span> Country
                                            </label>
                                            <input placeholder="e.g. Germany" value={currentCar.country || ""} onChange={e => setCurrentCar({ ...currentCar, country: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                        <FormSelect
                                            icon={SPEC_ICONS.fuel}
                                            label="Fuel"
                                            value={currentCar.fuel || 'Gasoline'}
                                            options={CAR_FUEL_TYPES}
                                            onChange={(val) => setCurrentCar({ ...currentCar, fuel: val })}
                                        />
                                        <FormSelect
                                            icon={SPEC_ICONS.transmission}
                                            label="Transmission"
                                            value={currentCar.transmission || 'Auto'}
                                            options={CAR_TRANSMISSIONS}
                                            onChange={(val) => setCurrentCar({ ...currentCar, transmission: val })}
                                        />
                                        <div className="flex flex-col gap-1">
                                            <label className="text-[10px] text-white/40 uppercase font-black pl-1 font-sans flex items-center gap-1">
                                                <span className="material-symbols-outlined text-[12px]">{SPEC_ICONS.engineType}</span> Engine
                                            </label>
                                            <input placeholder="e.g. 3.5L V6 Twin-Turbo" value={currentCar.engineType || ""} onChange={e => setCurrentCar({ ...currentCar, engineType: e.target.value })} className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-white/20 font-sans" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 gap-3 mt-1">
                                        {[
                                            { key: 'canTow', label: 'Can Tow' },
                                            { key: 'hasCruiseControl', label: 'Cruise Control' },
                                            { key: 'hasDrivingAssist', label: 'Driving Assist' }
                                        ].map(({ key, label }) => {
                                            const isActive = !!currentCar[key];
                                            return (
                                                <button
                                                    key={key}
                                                    type="button"
                                                    onClick={() => setCurrentCar({ ...currentCar, [key]: !isActive })}
                                                    style={{
                                                        backgroundColor: isActive ? 'rgba(16,185,129,0.15)' : 'rgba(255,255,255,0.02)',
                                                        color: isActive ? '#34d399' : 'rgba(255,255,255,0.3)',
                                                        borderColor: isActive ? '#34d399' : 'rgba(255,255,255,0.06)'
                                                    }}
                                                    className="py-2 rounded-xl text-[10px] font-black tracking-wider uppercase border text-center transition-all duration-300 font-sans"
                                                >
                                                    {label}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    <div className="flex gap-2 mt-6 pt-4 border-t border-white/[0.04]">
                                        <button type="button" onClick={handleCloseAddEdit} className="flex-1 py-3 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-black uppercase tracking-wider font-sans">Cancel</button>
                                        <button type="submit" className="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-black rounded-xl text-xs font-black uppercase tracking-wider font-sans">Save Properties</button>
                                    </div>
                                </form>
                            </div>

                            {paletteContextMenu && (
                                <div 
                                    className="fixed inset-0 z-[110]" 
                                    onClick={() => setPaletteContextMenu(null)}
                                    onContextMenu={(e) => { e.preventDefault(); setPaletteContextMenu(null); }}
                                >
                                    <div 
                                        style={{ top: paletteContextMenu.y, left: paletteContextMenu.x }}
                                        className="fixed bg-[#1a1b20] border border-white/10 rounded-xl shadow-2xl py-1 z-[111]"
                                        onClick={(e) => e.stopPropagation()}
                                    >
                                        <button
                                            type="button"
                                            onClick={() => handleDeletePaletteSwatch(paletteContextMenu.name)}
                                            className="px-4 py-2 text-[11px] font-bold text-red-400 hover:bg-red-500/10 transition-colors whitespace-nowrap font-sans"
                                        >
                                            Delete "{paletteContextMenu.name}"
                                        </button>
                                    </div>
                                </div>
                            )}

                            {isAiImportOpen && (
                                <div className="fixed inset-0 z-[120] flex items-center justify-center p-6">
                                    <div className="absolute inset-0 bg-black/85 backdrop-blur-sm" onClick={() => setIsAiImportOpen(false)} />
                                    <div className="relative bg-[#121318] border border-white/10 rounded-3xl w-full max-w-lg max-h-[85vh] flex flex-col shadow-[0_24px_80px_rgba(0,0,0,0.9)]">
                                        <div className="px-6 py-5 border-b border-white/[0.06] flex items-center gap-2">
                                            <span className="material-symbols-outlined text-[18px] text-emerald-400">auto_awesome</span>
                                            <h3 className="text-sm font-black font-['Montserrat']">Import from AI</h3>
                                        </div>
                                        <div className="flex-1 overflow-y-auto p-6 flex flex-col gap-5">
                                            <div className="flex flex-col gap-2">
                                                <div className="flex items-center justify-between">
                                                    <label className="text-[10px] text-white/40 uppercase font-black font-sans">Step 1 -- copy this prompt</label>
                                                    <button
                                                        type="button"
                                                        onClick={() => {
                                                            navigator.clipboard.writeText(AI_IMPORT_PROMPT);
                                                            showNotification("Prompt copied! Paste it into Gemini along with a screenshot of the car.");
                                                        }}
                                                        className="text-[10px] font-black uppercase tracking-wider text-emerald-400 hover:text-emerald-300 transition-colors flex items-center gap-1"
                                                    >
                                                        <span className="material-symbols-outlined text-[13px]">content_copy</span>
                                                        Copy Prompt
                                                    </button>
                                                </div>
                                                <div className="bg-black/40 border border-white/[0.06] rounded-xl p-3 text-[10px] text-white/40 font-mono leading-relaxed max-h-24 overflow-y-auto">
                                                    {AI_IMPORT_PROMPT}
                                                </div>
                                                <p className="text-[10px] text-white/30 font-sans leading-relaxed">
                                                    Paste this into Gemini along with a screenshot of the car and its name/year/trim. It'll hand back a JSON block.
                                                </p>
                                            </div>

                                            <div className="flex flex-col gap-2">
                                                <label className="text-[10px] text-white/40 uppercase font-black font-sans">Step 2 -- paste Gemini's response</label>
                                                <textarea
                                                    value={aiImportText}
                                                    onChange={(e) => setAiImportText(e.target.value)}
                                                    placeholder='{ "year": 2024, "brand": "...", ... }'
                                                    rows={8}
                                                    className="bg-black/40 border border-white/[0.06] rounded-xl px-4 py-3 text-[11px] font-mono text-white focus:outline-none focus:border-emerald-500/40 font-sans resize-none"
                                                />
                                            </div>
                                        </div>
                                        <div className="p-6 pt-0 flex gap-2">
                                            <button
                                                type="button"
                                                onClick={() => { setIsAiImportOpen(false); setAiImportText(''); }}
                                                className="flex-1 py-3 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-black uppercase tracking-wider font-sans"
                                            >
                                                Cancel
                                            </button>
                                            <button
                                                type="button"
                                                onClick={handleAiImport}
                                                disabled={!aiImportText.trim()}
                                                className="flex-1 py-3 bg-gradient-to-b from-emerald-400 to-emerald-600 hover:from-emerald-300 hover:to-emerald-500 disabled:opacity-30 disabled:cursor-not-allowed text-black rounded-xl text-xs font-black uppercase tracking-wider font-sans transition-all"
                                            >
                                                Fill In Details
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
